[project]
name = "spectral-tracker"
version = "0.1.0"
description = "Real-time neutron data assimilation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "e3x",
    "jax>=0.9.1",
    "subhkl",
    "tfp-nightly",
]

[tool.uv.sources]
subhkl = { git = "https://github.com/neutrons/subhkl.git" }

# JAX with CUDA 12 support (NVIDIA GPUs)
[project.optional-dependencies]
cuda12 = [
  "jax[cuda12]",
]

# JAX with ROCm support (AMD GPUs)
rocm = [
  "jax[rocm]",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectral_tracker"]

[tool.pytest.ini_options]
pythonpath = ["tests", "src"]
addopts = ["--import-mode=importlib"]
